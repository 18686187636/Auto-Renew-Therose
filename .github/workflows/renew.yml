name: Auto Renew

on:
  workflow_dispatch:        # 允许手动及 API 触发
  # 可选：保留一个非常低频的备用触发（例如每天一次），但主要靠调度
  schedule:
    - cron: '0 0 * * *'     # 每天 UTC 0:00，作为保险

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install seleniumbase requests
          # 如果使用代理，可能需要安装额外的依赖
      - name: Run renewal script
        env:
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          CRONJOB_API_KEY: ${{ secrets.CRONJOB_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_REPO: ${{ secrets.GH_REPO }}
          GH_WORKFLOW_ID: ${{ secrets.GH_WORKFLOW_ID }}
          HEADLESS: true   # 无头模式
          # PROXY_SERVER: ${{ secrets.PROXY_SERVER }}  # 可选
        run: python renew.py
