name: Auto Renew TheRose

on:
  workflow_dispatch:

concurrency:
  group: therose-renew
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify playwright import
        run: |
          python -c "import playwright, sys; print('playwright ok:', playwright.__file__)"
          python -c "import requests; print('requests ok:', requests.__version__)"

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      # ===== 你原有的代理启动 step 放这里，保持原样 =====
      # - name: Start proxy
      #   if: env.PROXY_SERVER != ''
      #   run: |
      #     ... 启动 socks5 监听 127.0.0.1:1080 ...
      # ===== 代理 step 结束 =====

      - name: Run renew script
        env:
          THEROSE_EMAIL: ${{ secrets.THEROSE_EMAIL }}
          THEROSE_PASSWORD: ${{ secrets.THEROSE_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CRONJOB_API_KEY: ${{ secrets.CRONJOB_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GH_WORKFLOW_ID: ${{ secrets.GH_WORKFLOW_ID }}
          GH_BRANCH: main
          PROXY_SERVER: ${{ secrets.PROXY_SERVER }}
          HEADLESS: '1'
        run: python script.py

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_id }}
          path: "*.png"
          if-no-files-found: ignore
          retention-days: 3
