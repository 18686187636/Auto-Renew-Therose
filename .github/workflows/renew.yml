name: Renew The Rose Cloud

on:
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install latest SeleniumBase
        run: |
          pip uninstall -y seleniumbase || true
          pip install --no-cache-dir --force-reinstall git+https://github.com/seleniumbase/SeleniumBase.git@master
          pip install requests
          python -c "import seleniumbase; print('SeleniumBase version:', seleniumbase.__version__)"
          python -c "
from seleniumbase import SB
with SB(uc=True, headless=True) as sb:
    print('uc_click_captcha on driver:', hasattr(sb.driver, 'uc_click_captcha'))
    print('uc_click_captcha on sb:', hasattr(sb, 'uc_click_captcha'))
"

      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Run renewal script
        env:
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          HEADLESS: "true"
        run: |
          python script.py

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: |
            *.png
            *.log
          if-no-files-found: ignore
